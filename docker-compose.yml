version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: jersey-world-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=jersey-world

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: jersey-world-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/jersey-world
      - JWT_ACCESS_SECRET=jersey_world_super_secret_access_jwt_key_2026_x9281!
      - JWT_REFRESH_SECRET=jersey_world_super_secret_refresh_jwt_key_2026_w1928#
      - AI_PROVIDER=neural-canvas
      - PAYMENT_PROVIDER=simulator
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/uploads

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: jersey-world-client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongodb_data:
  uploads_data:
